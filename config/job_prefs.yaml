# Job preferences for discovery
search_keywords:
  - "machine learning engineer"
  - "ML engineer"
  - "AI engineer"
  - "LLM engineer"
  - "applied AI"
  - "research engineer AI"

locations:
  - "Bengaluru"
  - "Hyderabad"
  - "Remote"

# Filtering criteria (applied during triage and configurable via UI)
filters:
  # Visa / Work Authorization restrictions
  requires_visa_sponsorship: false
  target_countries:
    - "India"
  target_cities:
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
  # Remote jobs are always eligible
  allow_any_remote: true

  # Experience filtering
  candidate_experience_years: 2
  max_experience_gap_allowed: 1  # filter out jobs requiring > candidate_years + gap

  # Minimum relevance score to approve (1.0 to 10.0)
  min_score_threshold: 4.5


# Platforms to scrape (enable/disable per platform)
platforms:
  linkedin: true
  indeed: true
  glassdoor: true
  wellfound: true
  instahyre: true
  naukri: true
  hirist: true
  greenhouse: true
  lever: true
  ashby: true
  google_careers: false
  apple_jobs: false

# Proxy round-robin for scrapers (only use authenticated residential proxies here)
proxies: []

# Blocked companies (never apply here)
blocked_companies: []

