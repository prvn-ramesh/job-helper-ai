[project]
name = "auto-job"
version = "0.1.0"
description = "AI/ML Engineer automated job application engine"
readme = "README.md"
requires-python = ">=3.12, <3.14"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    # Database
    "aiosqlite>=0.20.0",
    # HTTP clients
    "httpx>=0.28.0",
    "curl-cffi>=0.7.0",
    # Browser automation
    "playwright>=1.49.0",
    # Job scraping
    "python-jobspy>=1.1.80",
    # Google integrations
    "gspread>=6.1.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.36.0",
    "google-generativeai>=0.8.0",
    # Task queue
    "celery>=5.4.0",
    "redis>=5.2.0",
    # YAML config
    "pyyaml>=6.0.2",
    # Telegram
    "python-telegram-bot>=21.7",
    # Utilities
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/domain", "src/application", "src/infrastructure", "src/container", "src/presentation"]

